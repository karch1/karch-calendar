<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1ac486">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.json">
  <title>나의 스마트 스케줄러</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <button id="sidebarToggle" class="btn btn-gray"> ☰ </button>

  <div id="chatBackdrop"></div>

  <div class="app-layout">
    <div class="calendar-container">
      <header class="flex flex-wrap justify-between items-center gap-4 mb-5 border-b border-gray-100 pb-4">
        <div class="flex items-center gap-1">
          <button onclick="prevMonth()" class="btn btn-gray !p-2 !rounded-lg text-xs"> ◀ </button>
          <h1 id="monthDisplay" class="text-xl font-bold min-w-[140px] text-center text-gray-800"></h1>
          <button onclick="nextMonth()" class="btn btn-gray !p-2 !rounded-lg text-xs"> ▶ </button>
        </div>
        <div class="flex flex-row gap-2">
          <button id="loginBtn" onclick="loginGoogle()" class="btn btn-blue !text-xs !py-2"> 로그인 </button>
          <button id="logoutBtn" onclick="logoutGoogle()" class="btn btn-red !text-xs !py-2" style="display:none;"> 로그아웃 </button>
        </div>
      </header>
      
      <div id="calendar" class="calendar-grid"></div>
    </div>

    <aside id="chatSidebar" class="chat-closed">
      <div id="chatHeader">
        <span>💬 <b>팀 채팅</b></span>
        <button id="closeChatBtn">✕</button>
      </div>
      <div id="chatMessages"></div>
      <div id="chatInputWrap">
        <input id="chatInput" placeholder="메시지를 입력하세요...">
        <button id="sendChatBtn"> 전송 </button>
      </div>
    </aside>
  </div>

  <div id="dayModal" class="modal-overlay" onclick="closeModal('dayModal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h2 id="modalDateTitle" class="text-lg font-bold mb-4 text-gray-800"></h2>
      <div id="modalEventList" class="flex flex-col gap-2"></div>
      <hr class="my-4 border-gray-100">
      <button onclick="openAddForm()" class="btn btn-blue w-full"> + 일정 추가 </button>
      <button onclick="closeModal('dayModal')" class="btn btn-gray w-full mt-2"> 닫기 </button>
    </div>
  </div>

  <div id="editModal" class="modal-overlay" onclick="closeModal('editModal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h2 class="text-lg font-bold mb-4 text-gray-800">📅 일정 작성</h2>
      <div class="flex flex-col gap-3">
        <input id="eventTitle" placeholder="제목" class="w-full p-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#1ac486]">
        <input id="eventTime" type="time" class="w-full p-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#1ac486]">
        
        <div class="flex gap-4 px-1 py-0.5">
          <label class="flex items-center gap-2 cursor-pointer font-bold text-xs text-gray-600">
            <input type="checkbox" id="eventShiftDay" class="w-4 h-4 rounded text-[#1ac486] accent-[#1ac486]"> ☀️ 주간 근무 일정
          </label>
          <label class="flex items-center gap-2 cursor-pointer font-bold text-xs text-gray-600">
            <input type="checkbox" id="eventShiftNight" class="w-4 h-4 rounded text-[#1ac486] accent-[#1ac486]"> 🌙 야간 근무 일정
          </label>
        </div>

        <textarea id="eventInitialMemo" placeholder="메모를 입력하세요" class="w-full p-3 border border-gray-200 rounded-xl text-sm h-28 focus:outline-none focus:border-[#1ac486] resize-none"></textarea>
      </div>
      <input type="hidden" id="editId">
      <div class="flex gap-2 mt-5">
        <button onclick="closeModal('editModal')" class="btn btn-gray flex-1"> 닫기 </button>
        <button id="saveBtn" class="btn btn-blue flex-1"> 저장 </button>
      </div>
    </div>
  </div>

  <aside id="userSidebar" class="fixed left-4 top-24 bg-white shadow-xl border border-gray-100 rounded-2xl p-4 w-48 text-xs font-bold z-50">
    <div class="mb-3 text-gray-400 tracking-wider flex items-center gap-1.5 text-[10px] uppercase"> 👤 사용자 필터 </div>
    <div id="userFilterList" class="flex flex-col gap-1.5"></div>
    <hr class="my-3 border-gray-100">
    <label class="flex items-center gap-2.5 cursor-pointer text-gray-600 font-semibold text-xs mt-1">
      <input type="checkbox" id="myOnlyToggle" class="w-4 h-4 rounded text-[#1ac486] accent-[#1ac486]"> 내 일정만 보기
    </label>
  </aside>

  <div id="toast"></div>

  <button id="mobileChatToggle"> 💬 </button>

  <script type="module" src="./js/script.js"></script>
</body>
</html>
