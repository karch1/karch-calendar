<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.json">
  <title>나의 스마트 스케줄러</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 0;
    }
    .calendar-container {
      flex: 1;
      max-width: none;
      padding: 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: #e5e7eb;
      border-radius: 16px;
      overflow: hidden;
      flex-grow: 1;
      align-items: start;
    }
    .calendar-day {
      background: #fff;
      padding: 6px;
      min-height: 100px;
      height: auto;
      overflow-wrap: break-word;
    }
    .day-label {
      text-align: center;
      padding: 10px;
      font-weight: 800;
      background: #fff;
    }
    .event-bar {
      font-size: 12px;
      padding: 3px 6px;
      border-radius: 6px;
      color: #fff;
      margin-top: 2px;
      word-break: break-word;
      white-space: normal;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: #fff;
      width: 95%;
      max-width: 500px;
      border-radius: 16px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .btn {
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-blue { background: #4f46e5; color: white; }
    .btn-red { background: #ef4444; color: white; }
    .btn-gray { background: #6b7280; color: white; }
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      opacity: 0;
      transition: 0.3s;
    }
    #userSidebar { transition: 0.3s; }
    #sidebarToggle { display: none; }
    
    @media (min-width: 769px) {
      #userSidebar { transform: translateX(0); }
    }
    @media (max-width: 768px) {
      .calendar-day { min-height: 140px; }
      .event-bar { font-size: 11px; padding: 2px 4px; }
      #userSidebar { transform: translateX(-120%); }
      #userSidebar.active { transform: translateX(0); }
      #sidebarToggle { display: block; }
    }
    
    .app-layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      max-width: 1700px;
      margin: 0 auto;
    }
    #chatSidebar {
      width: 340px;
      height: 95vh;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: sticky;
      top: 10px;
      margin-top: 10px;
    }
    #chatHeader {
      background: #4f46e5;
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      padding: 16px;
    }
    #chatMessages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      background: #f9fafb;
    }
    #chatInputWrap {
      display: flex;
      border-top: 1px solid #e5e7eb;
      background: #fff;
    }
    #chatInput {
      flex: 1;
      border: none;
      outline: none;
      padding: 14px;
      font-size: 14px;
    }
    #sendChatBtn {
      border: none;
      background: #4f46e5;
      color: #fff;
      padding: 0 18px;
      font-weight: 700;
      cursor: pointer;
    }
    #mobileChatToggle { display: none; }
    
    @media (max-width: 1200px) {
      #mobileChatToggle {
        display: flex;
        position: fixed;
        right: 16px;
        bottom: 16px;
        width: 60px;
        height: 60px;
        border: none;
        border-radius: 999px;
        background: #4f46e5;
        color: #fff;
        font-size: 28px;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      }
      #chatSidebar {
        display: flex;
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 70vh;
        z-index: 9998;
        border-radius: 20px 20px 0 0;
        transition: 0.3s;
        margin-top: 0;
      }
      #chatSidebar.chat-closed { transform: translateY(110%); }
      #chatSidebar.chat-open { transform: translateY(0); }
      .app-layout { flex-direction: column; }
    }
    
    .chat-item { display: flex; margin-bottom: 12px; }
    .chat-left { justify-content: flex-start; }
    .chat-right { justify-content: flex-end; }
    .chat-center { justify-content: center; text-align: center; }
    .chat-box { max-width: 70%; display: flex; flex-direction: column; }
    .chat-meta { display: flex; gap: 8px; font-size: 11px; font-weight: 700; margin-bottom: 4px; }
    .chat-time { font-size: 10px; color: #9ca3af; align-self: flex-end; margin-left: 4px; margin-right: 4px; }
    .chat-bubble { border-radius: 14px; padding: 10px; word-break: break-word; white-space: pre-wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .bot-bubble { background: #f3f4f6; color: #374151; font-size: 12px; border: 1px solid #e5e7eb; border-radius: 12px; padding: 8px 12px; max-width: 90%; font-weight: 600; }
  </style>
</head>
<body>

  <button id="sidebarToggle" class="fixed left-2 top-2 z-[999] btn btn-gray"> ☰ </button>

  <div class="app-layout">
    <div class="calendar-container">
      <header class="flex flex-wrap justify-between items-center gap-2 mb-4">
        <div class="flex items-center gap-2">
          <button onclick="prevMonth()" class="btn btn-gray"> ◀ </button>
          <h1 id="monthDisplay" class="text-xl font-extrabold min-w-[140px] text-center"> 로딩중... </h1>
          <button onclick="nextMonth()" class="btn btn-gray"> ▶ </button>
        </div>
        <div class="flex flex-row gap-2">
          <button id="loginBtn" onclick="loginGoogle()" class="btn btn-blue"> 로그인 </button>
          <button id="logoutBtn" onclick="logoutGoogle()" class="btn btn-red" style="display:none;"> 로그아웃 </button>
        </div>
      </header>
      <div id="calendar" class="calendar-grid"></div>
    </div>

    <aside id="chatSidebar" class="chat-closed">
      <div id="chatHeader"> 💬 팀 채팅 </div>
      <div id="chatMessages"></div>
      <div id="chatInputWrap">
        <input id="chatInput" placeholder="메시지 입력">
        <button id="sendChatBtn"> 전송 </button>
      </div>
    </aside>
  </div>

  <div id="dayModal" class="modal-overlay" onclick="closeModal('dayModal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h2 id="modalDateTitle" class="text-lg font-bold mb-3"> 날짜 </h2>
      <div id="modalEventList" class="flex flex-col gap-2"></div>
      <hr class="my-4">
      <button onclick="openAddForm()" class="btn btn-blue w-full"> + 일정 추가 </button>
      <button onclick="closeModal('dayModal')" class="btn btn-gray w-full mt-2"> 닫기 </button>
    </div>
  </div>

  <div id="editModal" class="modal-overlay" onclick="closeModal('editModal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h2 class="text-lg font-bold mb-3"> 📅 일정 작성 </h2>
      <input id="eventTitle" placeholder="제목" class="w-full p-2.5 my-1.25 border border-gray-200 rounded-lg">
      <input id="eventTime" type="time" class="w-full p-2.5 my-1.25 border border-gray-200 rounded-lg">
      <textarea id="eventInitialMemo" placeholder="메모" class="w-full p-2.5 my-1.25 border border-gray-200 rounded-lg h-[100px]"></textarea>
      <input type="hidden" id="editId">
      <button id="saveBtn" class="btn btn-blue w-full"> 저장 </button>
      <button onclick="closeModal('editModal')" class="btn btn-gray w-full mt-2"> 닫기 </button>
    </div>
  </div>

  <aside id="userSidebar" class="fixed left-2 top-24 bg-white shadow-lg rounded-xl p-3 w-44 text-xs font-bold z-50">
    <div class="mb-2 text-gray-500"> 👤 사용자 필터 </div>
    <div id="userFilterList"></div>
    <hr class="my-2">
    <label class="flex items-center gap-2 cursor-pointer">
      <input type="checkbox" id="myOnlyToggle"> 내 일정만 보기
    </label>
  </aside>

  <div id="toast"> 알림 </div>

  <button id="mobileChatToggle"> 💬 </button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, writeBatch,
      doc, onSnapshot, query, orderBy, limit, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-messaging.js";

    /* ========================= FIREBASE INIT ========================= */
    const firebaseConfig = {
      apiKey: "AIzaSyBU3jeOqj_FCBXeO2ghh5XlHBrQbUjNaiA",
      authDomain: "ahn-jin-zero.firebaseapp.com",
      projectId: "ahn-jin-zero",
      storageBucket: "ahn-jin-zero.firebasestorage.app",
      messagingSenderId: "55250475892",
      appId: "1:55250475892:web:c87555da879be518faaa21",
      measurementId: "G-V2TEL4TNPJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const messaging = getMessaging(app);

    /* ========================= STATE ========================= */
    const state = {
      currentDate: new Date(),
      events: [],
      selectedDateStr: null,
      currentUser: null,
      editId: null,
      selectedEvent: null,
      viewMode: "list",
      visibleUsers: {}
    };

    let chatUnsub = null;
    let lastMessageId = null;
    let isFirstChatLoad = true;
    let scheduleTimer = null;
    let notifiedSchedules = new Set();

    /* ========================= USER MAP ========================= */
    const userColorMap = {
      "choae000@gmail.com": { name: "갈치", color: "#6366f1" },
      "ssang9764@gmail.com": { name: "생마", color: "#38bdf8" },
      "cksgml0@naver.com": { name: "연막", color: "#8b5e3c" },
      "ahn7770@gmail.com": { name: "안크", color: "#ef4444" },
      "huigi@email.com": { name: "희기", color: "#f97316" }
    };

    Object.keys(userColorMap).forEach(email => {
      state.visibleUsers[email] = true;
    });

    /* ========================= ADMIN ========================= */
    const ADMIN_EMAIL = "choae000@gmail.com";
    function isAdmin() {
      return state.currentUser?.email === ADMIN_EMAIL;
    }
    function canEditEvent(eventData) {
      if (!state.currentUser) return false;
      if (isAdmin()) return true;
      return eventData.userEmail === state.currentUser.email;
    }

    /* ========================= SHIFT LOGIC ========================= */
    const SHIFT_START = new Date("2026-05-04");
    const SHIFT_PATTERN = [
      "주간","주간","주간","주간","주간", "휴","휴",
      "오후","오후","오후","오후","오후", "휴","휴",
      "야간","야간","야간","야간","야간", "휴","휴"
    ];

    function getShiftLabel(dateStr) {
      const target = new Date(dateStr);
      const diff = Math.floor((target - SHIFT_START) / (1000 * 60 * 60 * 24));
      if (diff < 0) return "";
      return SHIFT_PATTERN[diff % SHIFT_PATTERN.length];
    }

    /* ========================= ELEMENTS ========================= */
    const calendarEl = document.getElementById('calendar');
    const monthDisplay = document.getElementById('monthDisplay');

    /* ========================= TOAST ========================= */
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.opacity = 1;
      setTimeout(() => { t.style.opacity = 0; }, 2000);
    }

    /* ========================= LOGIN / LOGOUT ========================= */
    window.loginGoogle = async () => {
      await signInWithPopup(auth, provider);
      showToast("로그인 완료");
    };
    window.logoutGoogle = async () => {
      await signOut(auth);
      showToast("로그아웃 완료");
    };

    /* ========================= AUTH STATE ========================= */
    onAuthStateChanged(auth, (user) => {
      const loginBtn = document.getElementById("loginBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      if (user && userColorMap[user.email]) {
        loginBtn.style.display = "none";
        logoutBtn.style.display = "block";
        const p = userColorMap[user.email];
        state.currentUser = {
          uid: user.uid,
          email: user.email,
          name: p.name,
          color: p.color
        };
        loadEvents();
        listenChat();
        startScheduleNotifier();
      } else {
        loginBtn.style.display = "block";
        logoutBtn.style.display = "none";
        state.currentUser = null;
        state.events = [];
        if (scheduleTimer) {
          clearInterval(scheduleTimer);
          scheduleTimer = null;
        }
        notifiedSchedules.clear();
        renderCalendar();
      }
    });

    /* ========================= LOAD EVENTS ========================= */
    async function loadEvents() {
      const snap = await getDocs(collection(db, "events"));
      state.events = [];
      snap.forEach(d => {
        state.events.push({ id: d.id, ...d.data() });
      });
      renderUserFilters();
      renderCalendar();
    }

    /* ========================= OPEN ADD FORM ========================= */
    window.openAddForm = function () {
      if (!state.currentUser) return showToast("로그인 필요");
      state.editId = null;
      document.getElementById('eventTitle').value = "";
      document.getElementById('eventTime').value = "";
      document.getElementById('eventInitialMemo').value = "";
      document.getElementById('editModal').style.display = "flex";
    };

    /* ========================= MONTH MOVE ========================= */
    window.prevMonth = function () {
      state.currentDate.setMonth(state.currentDate.getMonth() - 1);
      renderCalendar();
    };
    window.nextMonth = function () {
      state.currentDate.setMonth(state.currentDate.getMonth() + 1);
      renderCalendar();
    };

    const sidebar = document.getElementById("userSidebar");
    const sidebarToggle = document.getElementById("sidebarToggle");
    sidebarToggle.onclick = () => {
      sidebar.classList.toggle("active");
    };

    /* ========================= MOBILE CHAT TOGGLE ========================= */
    const mobileChatToggle = document.getElementById("mobileChatToggle");
    const chatSidebar = document.getElementById("chatSidebar");
    if (mobileChatToggle) {
      mobileChatToggle.onclick = () => {
        if (chatSidebar.classList.contains("chat-open")) {
          chatSidebar.classList.remove("chat-open");
          chatSidebar.classList.add("chat-closed");
        } else {
          chatSidebar.classList.remove("chat-closed");
          chatSidebar.classList.add("chat-open");
        }
      };
    }

    /* ========================= EDIT EVENT OPEN ========================= */
    window.editEvent = function (e) {
      if (!canEditEvent(e)) {
        return showToast("본인 일정만 수정 가능");
      }
      state.selectedDateStr = e.date;
      state.editId = e.id;
      document.getElementById('eventTitle').value = e.title;
      document.getElementById('eventTime').value = e.time || "";
      document.getElementById('eventInitialMemo').value = e.memo || "";
      document.getElementById('editModal').style.display = "flex";
    };

    /* ========================= DELETE EVENT ========================= */
    window.deleteEvent = async function (id) {
      const target = state.events.find(e => e.id === id);
      if (!target) return showToast("일정을 찾을 수 없음");
      if (!canEditEvent(target)) return showToast("본인 일정만 삭제 가능");

      await deleteDoc(doc(db, "events", id));
      state.events = state.events.filter(e => e.id !== id);
      renderCalendar();
      closeModal('dayModal');
      showToast("삭제 완료");
    };

    /* ========================= CLOSE MODAL ========================= */
    window.closeModal = function (id) {
      document.getElementById(id).style.display = "none";
    };

    /* ========================= SAVE EVENT ========================= */
    document.getElementById('saveBtn').onclick = async () => {
      const title = document.getElementById('eventTitle').value.trim();
      const time = document.getElementById('eventTime').value;
      const memo = document.getElementById('eventInitialMemo').value;

      if (!state.selectedDateStr) return showToast("날짜 선택");
      if (!title) return showToast("제목 입력");

      const data = {
        date: state.selectedDateStr,
        title,
        time,
        memo,
        userColor: state.currentUser.color,
        userUid: state.currentUser.uid,
        userEmail: state.currentUser.email,
        userName: state.currentUser.name
      };

      const [year, month, day] = state.selectedDateStr.split('-');
      const formattedDate = `${parseInt(month)}월 ${parseInt(day)}일`;
      const timeDisplay = time ? `[${time}] ` : '';

      if (state.editId) {
        await updateDoc(doc(db, "events", state.editId), data);
        const idx = state.events.findIndex(e => e.id === state.editId);
        state.events[idx] = { ...state.events[idx], ...data };
        state.editId = null;
        showToast("수정 완료");

        await addDoc(collection(db, "messages"), {
          text: `📢 [일정 수정]\n${formattedDate} ${timeDisplay}\n"${title}" 일정이 수정되었습니다.`,
          userName: "시스템 봇",
          userColor: "#10b981",
          userUid: "system-bot",
          createdAt: serverTimestamp()
        });
      } else {
        const ref = await addDoc(collection(db, "events"), data);
        state.events.push({ id: ref.id, ...data });
        showToast("저장 완료");

        await addDoc(collection(db, "messages"), {
          text: `📅 [일정 등록]\n${formattedDate} ${timeDisplay}\n"${title}" 일정을 등록했습니다!`,
          userName: "시스템 봇",
          userColor: "#4f46e5",
          userUid: "system-bot",
          createdAt: serverTimestamp()
        });
      }
      renderCalendar();
      closeModal('editModal');
      closeModal('dayModal');
    };

    /* ========================= USER FILTER RENDER ========================= */
    function renderUserFilters() {
      const wrap = document.getElementById("userFilterList");
      wrap.innerHTML = "";
      Object.entries(userColorMap).forEach(([email, user]) => {
        const row = document.createElement("label");
        row.className = "flex items-center gap-2 mb-2 cursor-pointer";
        row.innerHTML = `
          <input type="checkbox" ${state.visibleUsers[email] ? "checked" : ""} data-email="${email}">
          <span class="w-3 h-3 rounded-full" style="background:${user.color}"></span>
          ${user.name}
        `;
        wrap.appendChild(row);
      });

      wrap.querySelectorAll("input").forEach(chk => {
        chk.onchange = () => {
          const email = chk.dataset.email;
          state.visibleUsers[email] = chk.checked;
          renderCalendar();
        };
      });
    }

    /* ========================= MY ONLY TOGGLE ========================= */
    document.getElementById("myOnlyToggle").onchange = (e) => {
      if (!state.currentUser) return;
      const checked = e.target.checked;
      Object.keys(state.visibleUsers).forEach(email => {
        state.visibleUsers[email] = checked ? email === state.currentUser.email : true;
      });
      renderUserFilters();
      renderCalendar();
    };

    /* ========================= CALENDAR RENDER ========================= */
    function renderCalendar() {
      calendarEl.innerHTML = '';
      const y = state.currentDate.getFullYear();
      const m = state.currentDate.getMonth();
      monthDisplay.innerText = `${y}년 ${m + 1}월`;

      const days = ['일', '월', '화', '수', '목', '금', '토'];
      days.forEach(d => {
        const el = document.createElement('div');
        el.className = "day-label";
        el.innerText = d;
        calendarEl.appendChild(el);
      });

      const first = new Date(y, m, 1).getDay();
      const last = new Date(y, m + 1, 0).getDate();
      const todayStr = new Date().toISOString().split("T")[0];

      for (let i = 0; i < first; i++) {
        calendarEl.appendChild(document.createElement('div'));
      }

      for (let d = 1; d <= last; d++) {
        const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const shift = getShiftLabel(dateStr);
        const div = document.createElement('div');
        div.className = "calendar-day";

        if (dateStr === todayStr) {
          div.style.outline = "3px solid #4f46e5";
          div.style.background = "#eef2ff";
        }

        div.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="day-num">${d}</span>
            <span style="font-size:10px;font-weight:800;color:#64748b;">${shift}</span>
          </div>
        `;

        const events = state.events.filter(e => e.date === dateStr && state.visibleUsers[e.userEmail]);
        events.forEach(e => {
          const bar = document.createElement('div');
          bar.className = "event-bar";
          bar.style.background = e.userColor;
          bar.innerText = e.title;
          bar.onclick = (ev) => {
            ev.stopPropagation();
            openEventDetail(e);
          };
          div.appendChild(bar);
        });

        div.onclick = () => openDayModal(dateStr);
        calendarEl.appendChild(div);
      }
    }

    /* ========================= DAY MODAL ========================= */
    window.openDayModal = function (dateStr) {
      state.selectedDateStr = dateStr;
      state.viewMode = "list";
      const modal = document.getElementById('dayModal');
      const list = document.getElementById('modalEventList');
      const title = document.getElementById('modalDateTitle');
      title.innerText = dateStr;

      const events = state.events.filter(e => e.date === dateStr && state.visibleUsers[e.userEmail]);
      list.innerHTML = "";
      if (events.length === 0) {
        list.innerHTML = "<div class='text-gray-400 text-sm text-center py-4'>일정이 없습니다.</div>";
      }
      events.forEach(e => {
        const div = document.createElement('div');
        div.className = "p-3 bg-gray-100 rounded-xl cursor-pointer hover:bg-gray-200 transition text-left";
        div.innerHTML = `<b>${e.title}</b><br/><small>${e.time || ""}</small>`;
        div.onclick = () => openEventDetail(e);
        list.appendChild(div);
      });
      modal.style.display = "flex";
    };

    /* ========================= DETAIL MODAL ========================= */
    window.openEventDetail = function (e) {
      state.selectedEvent = e;
      state.viewMode = "detail";
      const modal = document.getElementById('dayModal');
      const list = document.getElementById('modalEventList');
      const editable = canEditEvent(e);

      list.innerHTML = `
        <div class="p-4 bg-white rounded-xl border shadow text-left">
          <div class="font-bold text-lg">${e.title}</div>
          <div class="text-sm text-gray-500">${e.time || ""}</div>
          <div class="mt-2 text-sm text-gray-700 whitespace-pre-wrap">${e.memo || "메모가 없습니다."}</div>
          <div class="mt-2 text-xs font-bold" style="color:${e.userColor};">작성자 : ${e.userName}</div>
          <div style="margin-top:12px;display:flex;gap:6px;">
            ${editable ? `
              <button onclick='editEvent(${JSON.stringify(e).replaceAll('"', '&quot;')})' class="px-3 py-1 bg-indigo-500 text-white rounded font-bold text-xs">수정</button>
              <button onclick="deleteEvent('${e.id}')" class="px-3 py-1 bg-red-500 text-white rounded font-bold text-xs">삭제</button>
            ` : ''}
            <button onclick="openDayModal('${e.date}')" class="px-3 py-1 bg-gray-400 text-white rounded font-bold text-xs">목록</button>
          </div>
        </div>
      `;
      modal.style.display = "flex";
    };

  
/* ========================= CHAT CODE ========================= */
const chatMessages = document.getElementById("chatMessages");
const chatInput = document.getElementById("chatInput");

chatInput.addEventListener("keydown", (e) => {

  if (e.isComposing) return;

  if (e.key === "Enter") {

    e.preventDefault();

    document.getElementById("sendChatBtn").click();
  }
});

/* ========================= SEND CHAT ========================= */
document.getElementById("sendChatBtn").onclick = async () => {

  if (!state.currentUser) {
    return showToast("로그인 필요");
  }

  const text = chatInput.value.trim();
  if (!text) return;

  /* ========================= !오늘 COMMAND ========================= */
  if (text === "!오늘") {
    chatInput.value = "";

    const todayStr = new Date().toISOString().split("T")[0];

    const todayEvents = state.events.filter(e =>
      e.date === todayStr &&
      state.visibleUsers[e.userEmail]
    );

    let message = `🤖 일정받아라 (${todayStr})\n────────────────`;

    if (todayEvents.length === 0) {
      message += `\n📭 오늘 일정은 없다이가`;
    } else {
      todayEvents.forEach(e => {
        message += `\n👤 ${e.userName}: [${e.time || "-"}] ${e.title} 있데이`;
      });
    }

    message += `\n────────────────\n💡 필터 켜놓은 놈만 보여준다`;

    await addDoc(collection(db, "messages"), {
      text: message,
      userName: "안건전지 봇",
      userColor: "#10b981",
      userUid: "system-bot",
      createdAt: serverTimestamp()
    });

    return; // 여기서 멈춤
  }

  /* ========================= NORMAL CHAT ========================= */
  await addDoc(collection(db, "messages"), {

    text,
    userName: state.currentUser.name,
    userColor: state.currentUser.color,
    userUid: state.currentUser.uid,
    createdAt: serverTimestamp()
  });

  /* ========================= MESSAGE LIMIT ========================= */
  const q = query(
    collection(db, "messages"),
    orderBy("createdAt", "asc")
  );

  const snap = await getDocs(q);

  if (snap.size > 100) {

    const deleteCount = snap.size - 100;

    const batch = writeBatch(db);

    for (let i = 0; i < deleteCount; i++) {

      const docRef = doc(db, "messages", snap.docs[i].id);

      batch.delete(docRef);
    }

    await batch.commit();
  }

  chatInput.value = "";
};

/* ========================= LISTEN CHAT ========================= */
function listenChat() {

  if (!state.currentUser) return;

  if (chatUnsub) chatUnsub();

  const q = query(
    collection(db, "messages"),
    orderBy("createdAt"),
    limit(100)
  );

  chatUnsub = onSnapshot(q, (snapshot) => {

    chatMessages.innerHTML = "";

    const docs = snapshot.docs;

    if (docs.length > 0) {

      const latestDoc = docs[docs.length - 1];

      const latestData = latestDoc.data();

      if (
        !isFirstChatLoad &&
        lastMessageId &&
        lastMessageId !== latestDoc.id &&
        latestData.userUid !== state.currentUser?.uid
      ) {

        showToast("💬 새 메시지 도착");

        if (Notification.permission === "granted") {

          navigator.serviceWorker.getRegistration().then(reg => {

            if (reg) {

              reg.showNotification("새 메시지", {

                body: `${latestData.userName}: ${latestData.text}`,
                icon: "./icon-192.png",
                badge: "./icon-192.png",
                tag: "chat-message",
                renotify: false
              });
            }
          });
        }
      }

      lastMessageId = latestDoc.id;
    }

    snapshot.forEach(docSnap => {

      const m = docSnap.data();

      const isBot = m.userUid === "system-bot";

      const isMe =
        m.userUid === state.currentUser?.uid &&
        !isBot;

      const dateObj = (m.createdAt && typeof m.createdAt.toDate === 'function')
        ? m.createdAt.toDate()
        : new Date();

      const timeStr = dateObj.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });

      const item = document.createElement("div");

      if (isBot) {

        item.className = "chat-item chat-center";

        item.innerHTML = `
          <div>
            <div style="
              font-size:11px;
              font-weight:800;
              color:${m.userColor || '#10b981'};
              margin-bottom:4px;
            ">
              ${m.userName}
            </div>

            <div class="bot-bubble mx-auto"
                 style="border-left:4px solid ${m.userColor || '#4f46e5'}">

              ${m.text.replaceAll('\n', '<br>')}
            </div>
          </div>
        `;

      } else {

        item.className =
          `chat-item ${isMe ? 'chat-right' : 'chat-left'}`;

        item.innerHTML = `
          <div class="chat-box">

            ${!isMe
              ? `<div class="chat-meta"
                     style="color:${m.userColor}">
                     ${m.userName}
                 </div>`
              : ''
            }

            <div class="flex ${isMe ? 'flex-row-reverse' : 'flex-row'} items-end">

              <div class="chat-bubble"
                   style="
                     background:${isMe ? '#4f46e5' : '#e5e7eb'};
                     color:${isMe ? '#fff' : '#111'}
                   ">

                ${m.text}
              </div>

              <span class="chat-time">
                ${timeStr}
              </span>

            </div>
          </div>
        `;
      }

      chatMessages.appendChild(item);

    });

    chatMessages.scrollTop =
      chatMessages.scrollHeight;

    isFirstChatLoad = false;
  });
}

/* ========================= SERVICE WORKER ========================= */

  navigator.serviceWorker.register("./service-worker.js")

/* ========================= SCHEDULE NOTIFIER ========================= */
function startScheduleNotifier() {

  if (scheduleTimer)
    clearInterval(scheduleTimer);

  scheduleTimer = setInterval(() => {

    if (!state.currentUser) return;

    const now = new Date();

    state.events.forEach(e => {

      if (!e.date || !e.time) return;

      const eventTime =
        new Date(`${e.date}T${e.time}:00`);

      const diff = eventTime - now;

      if (diff > 0 && diff <= 5 * 60 * 1000) {

        const key = e.id + "_5min";

        if (notifiedSchedules.has(key)) return;

        notifiedSchedules.add(key);

        triggerScheduleNotification(e, "5분 전");
      }

      if (diff > 0 && diff <= 1000) {

        const key = e.id + "_now";

        if (notifiedSchedules.has(key)) return;

        notifiedSchedules.add(key);

        triggerScheduleNotification(e, "지금 시작");
      }
    });

  }, 10000);
}

/* ========================= NOTIFICATION CORE ========================= */
function triggerScheduleNotification(event, label) {

  showToast(`📅 ${label}`);

  if (Notification.permission !== "granted")
    return;

  navigator.serviceWorker
    .getRegistration()
    .then(reg => {

      if (!reg) return;

      reg.showNotification("📅 일정 알림", {

        body: `${label}\n${event.title}`,
        icon: "./icon-192.png",
        badge: "./icon-192.png",
        tag: "schedule-" + event.id,
        renotify: false
      });
    });
}

/* ========================= FOREGROUND NOTIFICATION ========================= */
onMessage(messaging, (payload) => {

  console.log("포그라운드 알림", payload);

  if (payload?.notification?.title) {

    showToast(payload.notification.title);
  }
});
